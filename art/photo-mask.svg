<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <!-- Maske som gir bildene en myk, «malt» kant. Hvit = synlig. -->
  <defs>
    <filter id="deckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect x="22" y="22" width="556" height="706" rx="26" fill="#fff" filter="url(#deckle)"/>
</svg>
