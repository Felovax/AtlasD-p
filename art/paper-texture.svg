<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <!-- Fliselagt papirstruktur: fint korn + svake fibre og flekker. Legges over bakgrunnen med lav opasitet. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="3" stitchTiles="stitch" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0 0.16  0.3 0 0 0 -0.1" result="ga"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="12" stitchTiles="stitch" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0.28 0 0 0 -0.1" result="ba"/>
      <feMerge><feMergeNode in="ba"/><feMergeNode in="ga"/></feMerge>
    </filter>
  </defs>
  <rect width="360" height="360" fill="#000" filter="url(#grain)"/>
</svg>
