<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760">
  <!-- Maske for «boksider» med revet papirkant. Hvit = synlig. -->
  <defs>
    <filter id="torn" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="9" result="w"/>
      <feDisplacementMap in="d" in2="w" scale="12" xChannelSelector="G" yChannelSelector="R"/>
    </filter>
  </defs>
  <rect x="14" y="14" width="572" height="732" rx="4" fill="#fff" filter="url(#torn)"/>
</svg>
