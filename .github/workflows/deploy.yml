# Bygger og publiserer invitasjonen til GitHub Pages hver gang main oppdateres.
# Kan ogsÃ¥ startes manuelt: Actions â†’ Â«Publiser invitasjonenÂ» â†’ Run workflow.
#
# FÃ¸r fÃ¸rste kjÃ¸ring (se README â†’ Â«PubliseringÂ»):
#   1. Settings â†’ Pages â†’ Source: Â«GitHub ActionsÂ»
#   2. Settings â†’ Secrets and variables â†’ Actions â†’ Variables (eller Secrets â€“ begge virker):
#        VITE_SUPABASE_URL              (f.eks. https://abcd1234.supabase.co)
#        VITE_SUPABASE_PUBLISHABLE_KEY  (publishable key eller den eldre anon-nÃ¸kkelen)
#      Disse er offentlige verdier (de havner i nettleseren uansett) â€“ IKKE legg inn service_role/secret key.
name: Publiser invitasjonen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tester (skjema, formatering, CSV)
        run: npm test

      - name: Tester (database og sikkerhetsregler)
        run: npm run test:db

      - name: Finn adressen til siden
        id: pages
        uses: actions/configure-pages@v5

      - name: Sjekk Supabase-oppsett
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY er ikke satt. Siden publiseres, men svarskjemaet vil vise Â«ikke klar ennÃ¥Â»."
          fi

      - name: Bygg
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

