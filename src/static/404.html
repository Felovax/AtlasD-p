<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Her var det ingen sti</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f7efdc;
        color: #3e2c1e;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.8rem 1.6rem;
        border: 2px solid #3e2c1e;
        border-radius: 999px;
        background: #e8a93a;
        color: #3e2c1e;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Oi! Her var det ingen sti.</h1>
      <p>Siden du lette etter finnes ikke. Vi tar deg tilbake til invitasjonen …</p>
      <a id="home" href="/">Til invitasjonen</a>
    </main>
    <script>
      // __BASE__ byttes ut med sidens adresse når siden bygges (se vite.config.ts).
      (function () {
        var home = '__BASE__';
        document.getElementById('home').setAttribute('href', home);
        setTimeout(function () {
          location.replace(home);
        }, 2500);
      })();
    </script>
  </body>
</html>
